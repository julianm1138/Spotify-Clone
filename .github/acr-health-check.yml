name: ACR Health Check

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 9 * * *" # daily at 9 AM UTC

jobs:
  acr-check:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repo (needed for any scripts if you include them)
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Log in to Azure using the same credentials as your deploy workflow
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 3. Check ACR image count
      - name: Check ACR Image Count
        run: |
          ACR_NAME="${{ secrets.ACR_NAME }}"
          REPOSITORY="spotify-clone"
          MAX_IMAGES=10

          images=$(az acr repository show-tags \
            --name $ACR_NAME \
            --repository $REPOSITORY \
            --orderby time_desc \
            --output tsv)

          image_count=$(echo "$images" | wc -l)
          echo "Image count: $image_count"

          if [ "$image_count" -gt "$MAX_IMAGES" ]; then
            echo "FAIL: Image count exceeds threshold!"
            exit 1
          else
            echo "PASS: Image count within threshold"
